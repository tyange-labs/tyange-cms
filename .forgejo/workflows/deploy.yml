name: Deploy Nuxt to Lightsail

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    # forgejo-runner를 `--label self-hosted:host`로 띄웠다는 전제 — Docker 없이
    # 러너를 구동하는 서버에서 직접 실행된다(격리 없음). tyange-dev의 워크플로와
    # 같은 패턴. 라벨을 바꿨다면 여기도 맞출 것.
    runs-on: self-hosted
    environment: deploy on aws

    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@v4

      - name: Setup Bun
        uses: https://github.com/oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Deploy files via SCP
        uses: https://github.com/appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          source: ".output,ecosystem.config.js"
          target: ${{ vars.DEPLOY_PATH }}
          strip_components: 0
          debug: true
          rm: true

      - name: Restart PM2
        uses: https://github.com/appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            cd ${{ vars.DEPLOY_PATH }}
            export NUXT_PUBLIC_TYANGE_CMS_API_BASE='${{ vars.NUXT_PUBLIC_TYANGE_CMS_API_BASE }}'
            export NUXT_PUBLIC_TYANGE_CMS_API_BASE_PROD='${{ vars.NUXT_PUBLIC_TYANGE_CMS_API_BASE_PROD }}'
            /home/ubuntu/.local/share/pnpm/pm2 startOrRestart ecosystem.config.js --update-env
            /home/ubuntu/.local/share/pnpm/pm2 save
