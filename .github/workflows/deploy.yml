name: Deploy Nuxt to Lightsail

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: deploy on aws

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Debug secret lengths
        run: |
          echo "HOST len: ${#HOST}"
          echo "USERNAME len: ${#USERNAME}"
          echo "SSH_PRIVATE_KEY len: ${#SSH_PRIVATE_KEY}"
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: ".output,ecosystem.config.js"
          target: ${{ vars.DEPLOY_PATH }}
          strip_components: 0
          debug: true
          rm: true

      - name: Restart PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ vars.DEPLOY_PATH }}
            export NUXT_PUBLIC_TYANGE_CMS_API_BASE='${{ vars.NUXT_PUBLIC_TYANGE_CMS_API_BASE }}'
            export NUXT_PUBLIC_TYANGE_CMS_API_BASE_PROD='${{ vars.NUXT_PUBLIC_TYANGE_CMS_API_BASE_PROD }}'
            /home/ubuntu/.local/share/pnpm/pm2 startOrRestart ecosystem.config.js --update-env
            /home/ubuntu/.local/share/pnpm/pm2 save
